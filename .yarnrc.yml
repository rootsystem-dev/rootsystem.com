# Yarn configuration.
#
# This file previously disabled three of Yarn's supply-chain protections. Those
# overrides arrived with the abandoned Next 16 / Chakra v3 migration branch,
# almost certainly to force past an install failure in that dependency tree.
# They are not needed here: with every setting at its default, both sites
# install, typecheck and build clean.
#
# The removed overrides, and what each one turned off:
#
#   npmMinimalAgeGate: 0
#     Default is 1440 (one day). Yarn refuses to install a package version
#     published more recently than this, so a version pushed by a compromised
#     maintainer has to survive a day of community exposure before it can land
#     in an install. Setting 0 removes that window entirely.
#     Bypass once with `yarn add --no-time-gate`, or permanently for a named
#     package via npmPreapprovedPackages -- both are narrower than disabling it.
#
#   enableScripts: true
#     Default is false since Yarn 4.14. Third-party install scripts are the
#     main execution vector in npm supply-chain attacks: without them a
#     malicious package has to be imported to do anything, with them it runs at
#     install time. The only package here requesting one is esbuild, which
#     ships its platform binaries as optional dependencies and works fine
#     without it (verified: esbuild 0.28.1 runs, both sites build).
#     If a future dependency genuinely needs one -- sharp, if Astro image
#     optimization is added -- allow that single package through
#     dependenciesMeta in package.json rather than re-enabling globally.
#
#   approvedGitRepositories: ["**"]
#     An allowlist of git repository URL globs permitted as dependency sources.
#     "**" permits any. This tree has no git-protocol dependencies, so the
#     default empty list costs nothing.
#
# Hardened mode is not set here. Yarn enables it automatically for pull
# requests on public repositories; this repository is private, so it never
# triggers on its own and is set explicitly in CI instead.

nodeLinker: node-modules
